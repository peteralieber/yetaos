config: {}
networks:
  - name: lxdbr0
    type: bridge
    config:
      ipv4.address: 10.100.0.1/24
      ipv4.nat: "true"
      ipv6.address: none
storage_pools:
  - name: lxd-pool
    driver: zfs
profiles:
  - name: default
    config: {}
    devices:
      eth0:
        name: eth0
        network: lxdbr0
        type: nic
      root:
        path: /
        pool: lxd-pool
        type: disk
cluster: null
