name: service/rocm-gpu
description: AMD ROCm device passthrough profile
category: service
depends:
  - service/base
lxd:
  config:
    raw.apparmor: "deny /proc/sysrq-trigger rwklx,"
  devices:
    kfd:
      type: unix-char
      source: /dev/kfd
      path: /dev/kfd
    render:
      type: unix-char
      source: /dev/dri/renderD128
      path: /dev/dri/renderD128
cloud_init: null
