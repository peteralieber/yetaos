{% if snapshots %}
<table>
  <thead>
    <tr>
      <th>Snapshot</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for snapshot in snapshots %}
    <tr>
      <td>{{ snapshot }}</td>
      <td>
        <button
          class="button"
          hx-post="/fragments/containers/{{ name or container.name }}/snapshots/{{ snapshot }}/restore"
          hx-confirm="Restore snapshot {{ snapshot }}?"
        >Restore</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="muted" style="margin: 0">No snapshots yet.</p>
{% endif %}
